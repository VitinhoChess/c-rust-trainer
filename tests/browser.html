<!doctype html><meta charset="utf-8"><title>Vérification de l’atelier</title>
<style>body{margin:0}iframe{width:100vw;height:100vh;border:0}#result{position:fixed;top:0;background:white;z-index:99;font:12px monospace;max-height:140px;overflow:auto}</style>
<pre id="result">RUNNING</pre><iframe id="app" title="Atelier en test"></iframe>
<script type="module">
const frame=document.querySelector('#app'), result=document.querySelector('#result'), checks=[];
const doc=()=>frame.contentDocument;
const saved=()=>JSON.parse(localStorage.getItem('atelier-c-rust-v1'));
function check(value,label){if(!value)throw Error(label);checks.push(label);}
async function waitFor(fn){for(let i=0;i<200;i++){if(fn())return;await new Promise(r=>setTimeout(r,30));}throw Error('Délai dépassé');}
const click=selector=>{const el=doc().querySelector(selector);if(!el)throw Error('Introuvable : '+selector);el.click();};
async function reload(){await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.contentWindow.location.reload();});await waitFor(()=>doc()?.querySelector('#setup-form'));}
function filter(name,value){const el=doc().querySelector(`[name="${name}"]`);el.value=value;el.dispatchEvent(new Event('change',{bubbles:true}));}
const choose=(part,index)=>click(`[data-part="${part}"][data-choice="${index}"]`);
function answer(q){q.items.forEach((item,part)=>item.answers.forEach(index=>choose(part,index)));click('#validate');}
try{
  localStorage.removeItem('atelier-c-rust-v1');localStorage.removeItem('atelier-theme-v1');
  frame.src='../index.html';await waitFor(()=>doc()?.querySelector('#setup-form'));
  check(doc().body.textContent.includes('version 1.5'),'Version affichée');
  check(doc().querySelector('.stat-card strong').textContent==='900','900 exercices chargés');
  check(doc().querySelectorAll('[name="language"]').length===4&&!doc().querySelector('[value="comparison"]'),'C, C++ et Rust, aucune comparaison');
  check(doc().documentElement.scrollWidth<=frame.clientWidth,'Accueil sans débordement');
  const expectedTheme=frame.contentWindow.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  check(doc().documentElement.dataset.theme===expectedTheme,'Thème du navigateur');
  click('#open-settings');const theme=doc().querySelector('#theme-choice');theme.value='dark';theme.dispatchEvent(new Event('change',{bubbles:true}));doc().querySelector('#settings').close();
  await reload();check(doc().documentElement.dataset.theme==='dark','Thème sombre mémorisé');
  const {BANK_FILES,normalizeQuestions}=await import('../assets/core.js');
  const bank=normalizeQuestions(await Promise.all(BANK_FILES.map(file=>fetch('../database/'+file).then(r=>r.json()))));
  const byId=id=>bank.find(q=>q.id===id);
  click('[name="language"][value="c"]');filter('type','multi_question');filter('count','5');doc().querySelector('#setup-form').requestSubmit();
  const ids=saved().session.ids;let q=byId(ids[0]);
  check(ids.length===5&&new Set(ids.map(id=>byId(id).variant_group)).size===5,'Séance sans variantes répétées');
  check(!!saved().exposures[q.id].last_seen_at&&Object.keys(saved().records).length===0,'Présentation datée avant toute réponse');
  check(saved().session.presented.length===1,'Seul l’exercice affiché est marqué vu');
  check(doc().querySelectorAll('.question-part').length===2&&doc().querySelectorAll('.exercise-code').length===1,'Deux questions, un code partagé');
  check(doc().querySelector('#validate').disabled,'Validation désactivée sans sélection');
  const order=[...doc().querySelectorAll('[data-choice]')].map(el=>el.dataset.part+':'+el.dataset.choice).join(',');
  choose(0,q.items[0].answers[0]);check(doc().querySelector('#validate').disabled,'Toutes les questions doivent être renseignées');
  const bad=q.items[1].options.findIndex((_,i)=>!q.items[1].answers.includes(i));choose(1,bad);choose(1,bad);choose(1,bad);
  check(doc().querySelectorAll('[data-part="1"]:checked').length===1,'Cases multiples sélectionnables et désélectionnables');
  await reload();click('#resume');
  const restored=[...doc().querySelectorAll('[data-choice]')].map(el=>el.dataset.part+':'+el.dataset.choice).join(',');
  check(order===restored,'Ordre des options stable après rechargement');
  check(doc().querySelectorAll('.answer-input:checked').length===2,'Brouillon conservé');
  check(saved().exposures[q.id].seen_count===1,'La reprise ne compte pas une nouvelle présentation');
  click('#validate');
  check(doc().querySelectorAll('.feedback.success').length===1&&doc().querySelectorAll('.feedback.retry').length===1,'Correction individuelle des deux questions');
  check(saved().session.answers[0].score===1&&!saved().session.answers[0].correct,'Une erreur suffit pour rendre l’exercice à revoir');
  check(doc().documentElement.scrollWidth<=frame.clientWidth,'Exercice sans débordement');
  click('#validate');
  for(let i=1;i<ids.length;i++){answer(byId(ids[i]));click('#validate');}
  check(doc().querySelector('.score-circle strong').textContent.includes('4'),'Bilan de quatre exercices réussis');
  check(doc().querySelector('.results').textContent.includes('9 / 10 questions'),'Bilan détaillé de neuf questions réussies');
  click('#review-result');
  check(doc().querySelector('#review-count').textContent==='1','Une erreur à revoir');
  check(doc().querySelector('#setup-form button[type="submit"]').disabled&&doc().querySelector('.empty-inline').textContent.includes('plafond'),'Révision immédiate bloquée si le plafond serait dépassé');
  const state=saved(),old=new Date(Date.now()-8*86400000).toISOString();
  Object.values(state.exposures).forEach(e=>e.last_seen_at=old);state.history.forEach(e=>e.last_seen_at=old);localStorage.setItem('atelier-c-rust-v1',JSON.stringify(state));
  await reload();click('[data-view="review"]');doc().querySelector('#setup-form').requestSubmit();
  q=byId(saved().session.ids[0]);answer(q);click('#validate');click('#finish');
  check(doc().querySelector('#review-count').textContent==='0','Révision permise après expiration, erreur corrigée');
  click('[data-view="stats"]');check(doc().querySelectorAll('.language-progress').length===3,'Suivi des trois langages');
  check(doc().documentElement.scrollWidth<=frame.clientWidth,'Statistiques sans débordement');
  click('[data-view="practice"]');click('[name="language"][value="cpp"]');filter('type','multi_question');filter('count','5');doc().querySelector('#setup-form').requestSubmit();
  const cppIds=saved().session.ids;
  check(doc().querySelector('.language-tag').textContent==='C++','Banque C++ accessible');
  for(const id of cppIds){answer(byId(id));check(doc().querySelectorAll('.feedback.success').length===2,'Correction exacte C++ '+id);click('#validate');}
  click('#finish');click('[name="language"][value="rust"]');filter('type','multi_question');filter('count','5');doc().querySelector('#setup-form').requestSubmit();
  check(doc().querySelector('.language-tag').textContent==='Rust','Banque Rust accessible');answer(byId(saved().session.ids[0]));
  check(doc().querySelectorAll('.feedback.success').length===2,'Correction exacte des nouveaux exercices Rust');
  check(doc().documentElement.scrollWidth<=frame.clientWidth,'Rust sans débordement');
  localStorage.removeItem('atelier-c-rust-v1');localStorage.removeItem('atelier-theme-v1');
  result.textContent='PASS\n'+checks.join('\n');document.documentElement.dataset.test='pass';
}catch(error){result.textContent='FAIL\n'+checks.join('\n')+'\n'+error.stack;document.documentElement.dataset.test='fail';}
</script>
