services:
  - type: web
    name: atelier-c-rust
    runtime: static
    buildCommand: node scripts/build.mjs
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
